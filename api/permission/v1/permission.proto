	];
	// 是否新窗口
	bool frame_blank = 17 [
		json_name = "frame_blank",
		(openapi.v3.property) = { description: "是否新窗口" }
	];
}

message PermissionUpdateReply {}

// ========== 删除权限 ==========
message PermissionDeleteRequest {
	// 权限ID
	int64 id = 1 [
		json_name = "id",
		(openapi.v3.property) = { description: "权限ID" },
		(google.api.field_behavior) = REQUIRED
	];
}

message PermissionDeleteReply {}

// ========== 获取用户菜单 ==========
message GetUserMenuRequest {}

message GetUserMenuReply {
	repeated MenuItem list = 1 [
		json_name = "list",
		(openapi.v3.property) = { description: "菜单列表" }
	];
}

message MenuItem {
	string path = 1 [
		json_name = "path",
		(openapi.v3.property) = { description: "路由路径" }
	];
	string name = 2 [
		json_name = "name",
		(openapi.v3.property) = { description: "路由名称" }
	];
	string component = 3 [
		json_name = "component",
		(openapi.v3.property) = { description: "组件路径" }
	];
	string redirect = 4 [
		json_name = "redirect",
		(openapi.v3.property) = { description: "重定向路径" }
	];
	MenuMeta meta = 5 [
		json_name = "meta",
		(openapi.v3.property) = { description: "菜单元信息" }
	];
	repeated MenuItem children = 6 [
		json_name = "children",
		(openapi.v3.property) = { description: "子菜单" }
	];
}

message MenuMeta {
	map<string, string> title = 1 [
		json_name = "title",
		(openapi.v3.property) = { description: "标题(国际化)" }
	];
	string icon = 2 [
		json_name = "icon",
		(openapi.v3.property) = { description: "图标" }
	];
	int32 order_no = 3 [
		json_name = "orderNo",
		(openapi.v3.property) = { description: "排序号" }
	];
	bool hidden = 4 [
		json_name = "hidden",
		(openapi.v3.property) = { description: "是否隐藏" }
	];
	bool keep_alive = 5 [
		json_name = "keepAlive",
		(openapi.v3.property) = { description: "是否缓存" }
	];
	string frame_src = 6 [
		json_name = "frameSrc",
		(openapi.v3.property) = { description: "IFrame地址" }
	];
	bool frame_blank = 7 [
		json_name = "frameBlank",
		(openapi.v3.property) = { description: "是否新窗口" }
	];
}

// ========== 权限实体 ==========
message PermissionEntity {
	// 权限ID
	int64 id = 1 [
		json_name = "id",
		(openapi.v3.property) = { description: "权限ID" }
	];
	// 父权限ID
	int64 parent_id = 2 [
		json_name = "parent_id",
		(openapi.v3.property) = { description: "父权限ID" }
	];
	// 权限名称
	string name = 3 [
		json_name = "name",
		(openapi.v3.property) = { description: "权限名称" }
	];
	// 权限编码
	string code = 4 [
		json_name = "code",
		(openapi.v3.property) = { description: "权限编码" }
	];
	// 类型：MENU/BUTTON/API
	string type = 5 [
		json_name = "type",
		(openapi.v3.property) = { description: "类型：MENU/BUTTON/API" }
	];
	// API路径
	string api_path = 6 [
		json_name = "api_path",
		(openapi.v3.property) = { description: "API路径" }
	];
	// API方法
	string api_method = 7 [
		json_name = "api_method",
		(openapi.v3.property) = { description: "API方法" }
	];
	// 排序
	int32 sort = 8 [
		json_name = "sort",
		(openapi.v3.property) = { description: "排序" }
	];
	// 创建时间
	int64 created_at = 9 [
		json_name = "created_at",
		(openapi.v3.property) = { description: "创建时间" }
	];
	// 子权限
	repeated PermissionEntity children = 10 [
		json_name = "children",
		(openapi.v3.property) = { description: "子权限" }
	];
	// 路由路径
	string path = 11 [
		json_name = "path",
		(openapi.v3.property) = { description: "路由路径" }
	];
	// 组件路径
	string component = 12 [
		json_name = "component",
		(openapi.v3.property) = { description: "组件路径" }
	];
	// 重定向路径
	string redirect = 13 [
		json_name = "redirect",
		(openapi.v3.property) = { description: "重定向路径" }
	];
	// 图标
	string icon = 14 [
		json_name = "icon",
		(openapi.v3.property) = { description: "图标" }
	];
	// 排序号
	int32 order_no = 15 [
		json_name = "order_no",
		(openapi.v3.property) = { description: "排序号" }
	];
	// 是否隐藏
	bool hidden = 16 [
		json_name = "hidden",
		(openapi.v3.property) = { description: "是否隐藏" }
	];
	// 是否缓存
	bool keep_alive = 17 [
		json_name = "keep_alive",
		(openapi.v3.property) = { description: "是否缓存" }
	];
	// IFrame地址
	string frame_src = 18 [
		json_name = "frame_src",
		(openapi.v3.property) = { description: "IFrame地址" }
	];
	// 是否新窗口
	bool frame_blank = 19 [
		json_name = "frame_blank",
		(openapi.v3.property) = { description: "是否新窗口" }
	];
}
