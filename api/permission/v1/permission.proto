	];
	// 路由路径
	string path = 9 [
		json_name = "path",
		(openapi.v3.property) = { description: "路由路径" }
	];
	// 组件路径
	string component = 10 [
		json_name = "component",
		(openapi.v3.property) = { description: "组件路径" }
	];
	// 重定向路径
	string redirect = 11 [
		json_name = "redirect",
		(openapi.v3.property) = { description: "重定向路径" }
	];
	// 图标
	string icon = 12 [
		json_name = "icon",
		(openapi.v3.property) = { description: "图标" }
	];
	// 排序号
	int32 order_no = 13 [
