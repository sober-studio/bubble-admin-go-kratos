syntax = "proto3";

package api.package.v1;

option go_package = "github.com/sober-studio/bubble-admin-go-kratos/api/package/v1;v1";
option java_multiple_files = true;
option java_package = "api.package.v1";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "openapi/v3/annotations.proto";

service Package {
	// 获取套餐列表
	rpc List (PackageListRequest) returns (PackageListReply) {
		option (google.api.http) = {
			get: "/api/v1/package/list"
		};
		option(openapi.v3.operation) = {
			summary: "获取套餐列表"
		};
	}

	// 获取套餐详情
	rpc Get (PackageGetRequest) returns (PackageGetReply) {
		option (google.api.http) = {
			get: "/api/v1/package/{id}"
		};
		option(openapi.v3.operation) = {
			summary: "获取套餐详情"
		};
	}

	// 创建套餐
	rpc Create (PackageCreateRequest) returns (PackageCreateReply) {
		option (google.api.http) = {
			post: "/api/v1/package"
			body: "*"
		};
		option(openapi.v3.operation) = {
			summary: "创建套餐"
		};
	}

	// 更新套餐
	rpc Update (PackageUpdateRequest) returns (PackageUpdateReply) {
		option (google.api.http) = {
			put: "/api/v1/package/{id}"
			body: "*"
		};
		option(openapi.v3.operation) = {
			summary: "更新套餐"
		};
	}

	// 删除套餐
	rpc Delete (PackageDeleteRequest) returns (PackageDeleteReply) {
		option (google.api.http) = {
			delete: "/api/v1/package/{id}"
		};
		option(openapi.v3.operation) = {
			summary: "删除套餐"
		};
	}

	// 分配套餐权限
	rpc AssignPermissions (PackageAssignPermissionsRequest) returns (PackageAssignPermissionsReply) {
		option (google.api.http) = {
			put: "/api/v1/package/{id}/permissions"
			body: "*"
		};
		option(openapi.v3.operation) = {
			summary: "分配套餐权限"
		};
	}
}

// ========== 套餐列表 ==========
message PackageListRequest {
	// 套餐名称（模糊查询）
	string name = 1 [
		json_name = "name",
		(openapi.v3.property) = { description: "套餐名称（模糊查询）" }
	];
	// 状态：0=禁用，1=正常
	int32 status = 2 [
		json_name = "status",
		(openapi.v3.property) = { description: "状态：0=禁用，1=正常" }
	];
	// 页码
	int64 page = 3 [
		json_name = "page",
		(openapi.v3.property) = { description: "页码" }
	];
	// 每页数量
	int64 page_size = 4 [
		json_name = "page_size",
		(openapi.v3.property) = { description: "每页数量" }
	];
}

message PackageListReply {
	// 套餐列表
	repeated PackageEntity list = 1 [
		json_name = "list",
		(openapi.v3.property) = { description: "套餐列表" }
	];
	// 总数
	int64 total = 2 [
		json_name = "total",
		(openapi.v3.property) = { description: "总数" }
	];
}

// ========== 套餐详情 ==========
message PackageGetRequest {
	// 套餐ID
	int64 id = 1 [
		json_name = "id",
		(openapi.v3.property) = { description: "套餐ID" },
		(google.api.field_behavior) = REQUIRED
	];
}

message PackageGetReply {
	// 套餐信息
	PackageEntity pkg = 1 [
		json_name = "pkg",
		(openapi.v3.property) = { description: "套餐信息" }
	];
	// 权限ID列表
	repeated int64 permission_ids = 2 [
		json_name = "permission_ids",
		(openapi.v3.property) = { description: "权限ID列表" }
	];
}

// ========== 创建套餐 ==========
message PackageCreateRequest {
	// 套餐名称
	string name = 1 [
		json_name = "name",
		(openapi.v3.property) = { description: "套餐名称" },
		(google.api.field_behavior) = REQUIRED
	];
	// 套餐编码
	string code = 2 [
		json_name = "code",
		(openapi.v3.property) = { description: "套餐编码" },
		(google.api.field_behavior) = REQUIRED
	];
	// 描述
	string remark = 3 [
		json_name = "remark",
		(openapi.v3.property) = { description: "描述" }
	];
}

message PackageCreateReply {
	// 套餐ID
	int64 id = 1 [
		json_name = "id",
		(openapi.v3.property) = { description: "套餐ID" }
	];
}

// ========== 更新套餐 ==========
message PackageUpdateRequest {
	// 套餐ID
	int64 id = 1 [
		json_name = "id",
		(openapi.v3.property) = { description: "套餐ID" },
		(google.api.field_behavior) = REQUIRED
	];
	// 套餐名称
	string name = 2 [
		json_name = "name",
		(openapi.v3.property) = { description: "套餐名称" },
		(google.api.field_behavior) = REQUIRED
	];
	// 套餐编码
	string code = 3 [
		json_name = "code",
		(openapi.v3.property) = { description: "套餐编码" },
		(google.api.field_behavior) = REQUIRED
	];
	// 描述
	string remark = 4 [
		json_name = "remark",
		(openapi.v3.property) = { description: "描述" }
	];
}

message PackageUpdateReply {}

// ========== 删除套餐 ==========
message PackageDeleteRequest {
	// 套餐ID
	int64 id = 1 [
		json_name = "id",
		(openapi.v3.property) = { description: "套餐ID" },
		(google.api.field_behavior) = REQUIRED
	];
}

message PackageDeleteReply {}

// ========== 分配套餐权限 ==========
message PackageAssignPermissionsRequest {
	// 套餐ID
	int64 id = 1 [
		json_name = "id",
		(openapi.v3.property) = { description: "套餐ID" },
		(google.api.field_behavior) = REQUIRED
	];
	// 权限ID列表
	repeated int64 permission_ids = 2 [
		json_name = "permission_ids",
		(openapi.v3.property) = { description: "权限ID列表" }
	];
}

message PackageAssignPermissionsReply {}

// ========== 套餐实体 ==========
message PackageEntity {
	// 套餐ID
	int64 id = 1 [
		json_name = "id",
		(openapi.v3.property) = { description: "套餐ID" }
	];
	// 套餐名称
	string name = 2 [
		json_name = "name",
		(openapi.v3.property) = { description: "套餐名称" }
	];
	// 套餐编码
	string code = 3 [
		json_name = "code",
		(openapi.v3.property) = { description: "套餐编码" }
	];
	// 描述
	string remark = 4 [
		json_name = "remark",
		(openapi.v3.property) = { description: "描述" }
	];
	// 状态：0=禁用，1=正常
	int32 status = 5 [
		json_name = "status",
		(openapi.v3.property) = { description: "状态：0=禁用，1=正常" }
	];
	// 创建时间
	int64 created_at = 6 [
		json_name = "created_at",
		(openapi.v3.property) = { description: "创建时间" }
	];
}
